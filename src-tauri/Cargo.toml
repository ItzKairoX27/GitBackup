[package]
name = "gitbackup"
version = "1.0.0"
description = "A Tauri App"
authors = ["ItzKairoX27"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gitbackup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tar = "0.4.46"
flate2 = "1.1.9"
octocrab = "0.49.9"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
sha2 = "0.10.9"
aes = "0.8.4"
cbc = "0.1.2"
rand = "0.9.5"
hex = "0.4.3"
uuid = "1.20.0"
rustls = { version = "0.23.43", features = ["ring"] }
opener = "0.7.1"
tauri-plugin-notification = "2.3.3"
chrono = "0.4.45"
